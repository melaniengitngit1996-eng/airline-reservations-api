services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  database:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: airline_reservation
      MYSQL_USER: airline_user
      MYSQL_PASSWORD: airline_password
      MYSQL_ROOT_PASSWORD: local_root_password
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - airline_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - 127.0.0.1
        - -uroot
        - -plocal_root_password
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  airline_mysql_data:
